<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">SecDoc, Security Made Simple</title>
  <desc id="desc">The official SecDoc logo above Architecture, Engineering, and Operations on a dark technical grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090c"/>
      <stop offset="0.58" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f5b83d" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <path d="M0 300 C260 245 420 345 675 292 S1040 220 1280 280" fill="none" stroke="#f5b83d" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M0 318 C250 270 445 360 700 310 S1045 248 1280 302" fill="none" stroke="#f5b83d" stroke-opacity="0.07" stroke-width="1"/>
  <g filter="url(#shadow)">
    <rect x="385" y="35" width="510" height="183" rx="10" fill="#f4f4f4" stroke="#f5b83d" stroke-opacity="0.45"/>
    <image x="405" y="55" width="470" height="143" href="data:image/png;base64,"/>
  </g>
  <line x1="405" y1="250" x2="875" y2="250" stroke="#f5b83d" stroke-opacity="0.35"/>
  <text x="640" y="290" text-anchor="middle" fill="#f2f4f7" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="3">ARCHITECTURE | ENGINEERING | OPERATIONS</text>
  <g fill="#f5b83d">
    <circle cx="374" cy="250" r="4"/><circle cx="906" cy="250" r="4"/>
  </g>
  <rect x="1" y="1" width="1278" height="358" rx="19" fill="none" stroke="#f5b83d" stroke-opacity="0.25" stroke-width="2"/>
</svg>
